name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compute a monotonically increasing version from the build timestamp so
      # every CI artifact can overwrite-install over the previous one.
      - name: Compute version from timestamp
        id: version
        run: |
          echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
          CI_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease

      - name: Build Debug APK (fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
          CI_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          echo "⚠️ No signing secrets found, building debug APK (signed with debug keystore)"
          ./gradlew assembleDebug

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

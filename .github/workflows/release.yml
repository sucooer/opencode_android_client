name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Semver version (e.g., 1.0.0). Leave empty to use tag.'
        required: false
        type: string
        default: ''
      versionCode:
        description: 'Android versionCode. Leave empty to read from build.gradle.kts.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret must be configured to cut a release"
            exit 1
          fi

      # Tag format: v<major.minor.patch>, e.g. v1.0.0
      - name: Parse version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NAME="${{ inputs.versionName }}"
            CODE="${{ inputs.versionCode }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            NAME="$TAG"
            CODE=""
          fi
          if [[ -z "$NAME" ]]; then
            echo "::error::versionName is required. For tag push, use v<major.minor.patch>; for workflow_dispatch, provide versionName input."
            exit 1
          fi
          if [[ -z "$CODE" ]]; then
            CODE=$(grep -oP 'versionCode\s*=\s*ciVersionCode\s*\?\s*:\s*\K\d+' app/build.gradle.kts || true)
          fi
          if [[ -z "$CODE" || ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode could not be determined from tag or build.gradle.kts"
            exit 1
          fi
          echo "tag=$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_VERSION_NAME: ${{ steps.version.outputs.name }}
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK="opencode-client-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if [[ -f app/build/outputs/mapping/release/mapping.txt ]]; then
            cp app/build/outputs/mapping/release/mapping.txt "mapping-v${VERSION}.txt"
          fi
          sha256sum opencode-client-v${VERSION}.apk > SHA256SUMS.txt
          if [[ -f mapping-v*.txt ]]; then
            sha256sum mapping-v*.txt >> SHA256SUMS.txt
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            opencode-client-v*.apk
            mapping-v*.txt
            SHA256SUMS.txt